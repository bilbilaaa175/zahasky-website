<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zahasky — Reset Password</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS -->
  <link rel="stylesheet" href="tailwind.css" />
</head>

<body class="antialiased font-sans bg-white min-h-screen flex flex-col justify-center items-center p-6">

  <!-- Main Container -->
  <main class="w-full max-w-md mx-auto my-auto flex flex-col items-center">
    
    <!-- Title & Subtitle -->
    <h1 class="font-serif text-3xl md:text-4xl font-bold text-ink text-center">Password Baru</h1>
    <p class="mt-2 text-sm text-ink/60 text-center">Masukkan password baru untuk akun Anda.</p>

    <!-- Form -->
    <form id="reset-password-form" class="w-full mt-8 space-y-5" novalidate>
      
      <!-- Password Baru -->
      <div>
        <label for="new-password" class="field-label">Password Baru</label>
        <div class="relative">
          <input
            type="password"
            id="new-password"
            name="new-password"
            class="field-input pr-11"
            placeholder="Minimal 6 karakter"
            required
          />
          <button
            type="button"
            id="toggle-new-password"
            aria-label="Tampilkan password"
            class="absolute inset-y-0 right-0 flex items-center px-3.5 text-ink/40 hover:text-brown transition-colors cursor-pointer"
          >
            <svg class="icon-eye w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <svg class="icon-eye-off w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Konfirmasi Password -->
      <div>
        <label for="confirm-password" class="field-label">Konfirmasi Password</label>
        <div class="relative">
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            class="field-input pr-11"
            placeholder="Ulangi password"
            required
          />
          <button
            type="button"
            id="toggle-confirm-password"
            aria-label="Tampilkan password"
            class="absolute inset-y-0 right-0 flex items-center px-3.5 text-ink/40 hover:text-brown transition-colors cursor-pointer"
          >
            <svg class="icon-eye w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <svg class="icon-eye-off w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Pesan Notifikasi -->
      <p id="form-message" class="hidden text-sm font-medium text-center p-3 rounded-xl" role="alert"></p>

      <!-- Submit Button -->
      <button type="submit" id="submit-btn" class="btn-primary mt-2">
        Simpan Password
      </button>

      <!-- Copyright -->
      <div class="text-center pt-2">
        <p class="text-[11px] text-ink/40">
          &copy; 2026 Zahasky. All rights reserved.
        </p>
      </div>
    </form>
  </main>

  <!-- Supabase & App Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabaseClient.js"></script>
  <script src="assets/js/reset-pasword.js"></script>

</body>
</html>
