<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zahasky — Login</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS -->
  <link rel="stylesheet" href="tailwind.css" />
</head>

<body class="antialiased font-sans bg-white min-h-screen flex flex-col justify-center items-center p-6">

  <!-- Main Container (Centered) -->
  <main class="w-full max-w-md mx-auto my-auto flex flex-col items-center">
    
    <!-- Tombol Kembali ke Home -->
    <a 
      href="index.html" 
      class="inline-flex items-center justify-center gap-2 mb-6 text-sm font-medium text-ink/60 hover:text-brown transition-colors group text-center"
    >
      <svg 
        xmlns="http://www.w3.org/2000/svg" 
        width="16" 
        height="16" 
        class="w-4 h-4 shrink-0 transition-transform group-hover:-translate-x-1" 
        fill="none" 
        viewBox="0 0 24 24" 
        stroke="currentColor" 
        stroke-width="2"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
      </svg>
      <span>Kembali ke Beranda</span>
    </a>

    <!-- Title & Subtitle -->
    <h1 class="font-serif text-3xl md:text-4xl font-bold text-ink text-center">Masuk</h1>
    <p class="mt-2 text-sm text-ink/60 text-center">Masuk ke akun kamu untuk lanjut belanja.</p>

    <!-- Form -->
    <form id="login-form" class="w-full mt-8 space-y-5" novalidate>
      <!-- Email -->
      <div>
        <label for="email" class="field-label">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          class="field-input"
          placeholder="you@email.com"
          autocomplete="email"
          required
        />
      </div>

      <!-- Password + Link Lupa Password -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label for="password" class="field-label mb-0">Password</label>
          <a href="forgot-password.html" class="text-xs font-semibold text-brown hover:text-ink transition-colors">
            Lupa password?
          </a>
        </div>
        <div class="relative">
          <input
            type="password"
            id="password"
            name="password"
            class="field-input pr-11"
            placeholder="Masukkan password"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            id="toggle-password"
            aria-label="Tampilkan password"
            aria-pressed="false"
            class="absolute inset-y-0 right-0 flex items-center px-3.5 text-ink/40 hover:text-brown transition-colors cursor-pointer"
          >
            <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <svg id="icon-eye-off" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>
      </div>

      <p id="form-message" class="hidden text-sm font-medium text-center" role="alert"></p>

      <button type="submit" class="btn-primary mt-2">
        Masuk
      </button>

      <div class="text-center space-y-1.5 pt-1">
        <p class="text-sm text-ink/60">
          Belum punya akun?
          <a href="register.html" class="font-semibold text-brown hover:text-ink transition-colors">Daftar</a>
        </p>
        <p class="text-[11px] text-ink/40">
          &copy; 2026 Zahasky. All rights reserved.
        </p>
      </div>
    </form>
  </main>

  <script>
    const togglePassword = document.getElementById("toggle-password");
    const passwordInput = document.getElementById("password");
    const iconEye = document.getElementById("icon-eye");
    const iconEyeOff = document.getElementById("icon-eye-off");

    if (togglePassword) {
      togglePassword.addEventListener("click", () => {
        const isHidden = passwordInput.type === "password";
        passwordInput.type = isHidden ? "text" : "password";

        iconEye.classList.toggle("hidden", isHidden);
        iconEyeOff.classList.toggle("hidden", !isHidden);

        togglePassword.setAttribute("aria-pressed", isHidden ? "true" : "false");
        togglePassword.setAttribute("aria-label", isHidden ? "Sembunyikan password" : "Tampilkan password");
      });
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
