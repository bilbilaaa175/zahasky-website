<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zahasky — Lupa Password</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS -->
  <link rel="stylesheet" href="tailwind.css" />
</head>

<body class="antialiased font-sans bg-white min-h-screen flex flex-col justify-center items-center p-6">

  <!-- Main Container (Centered) -->
  <main class="w-full max-w-md mx-auto my-auto flex flex-col items-center">
    
    <!-- Tombol Kembali ke Home -->
    <a 
      href="index.html" 
      class="inline-flex items-center justify-center gap-2 mb-6 text-sm font-medium text-ink/60 hover:text-brown transition-colors group text-center"
    >
      <svg 
        xmlns="http://www.w3.org/2000/svg" 
        width="16" 
        height="16" 
        class="w-4 h-4 shrink-0 transition-transform group-hover:-translate-x-1" 
        fill="none" 
        viewBox="0 0 24 24" 
        stroke="currentColor" 
        stroke-width="2"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
      </svg>
      <span>Kembali ke Beranda</span>
    </a>

    <!-- Title & Subtitle -->
    <h1 class="font-serif text-3xl md:text-4xl font-bold text-ink text-center">Lupa Password</h1>
    <p class="mt-2 text-sm text-ink/60 text-center max-w-xs">Masukkan email Anda. Kami akan mengirim tautan untuk mengatur ulang password.</p>

    <!-- Form -->
    <form id="forgot-password-form" class="w-full mt-8 space-y-5" novalidate>
      <!-- Email -->
      <div>
        <label for="email" class="field-label">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          class="field-input"
          placeholder="you@email.com"
          autocomplete="email"
          required
        />
      </div>

      <!-- Notifikasi / Status Message -->
      <p id="form-message" class="hidden text-sm font-medium text-center p-3 rounded-xl" role="alert"></p>

      <!-- Submit Button -->
      <button type="submit" id="submit-btn" class="btn-primary mt-2">
        Kirim Tautan Reset
      </button>

      <!-- Link Masuk -->
      <div class="text-center space-y-1.5 pt-2">
        <p class="text-sm text-ink/60">
          Ingat password Anda?
          <a href="login.html" class="font-semibold text-brown hover:text-ink transition-colors">Masuk</a>
        </p>
        <p class="text-[11px] text-ink/40">
          &copy; 2026 Zahasky. All rights reserved.
        </p>
      </div>
    </form>
  </main>

  <!-- Supabase & App Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/main.js"></script>
  <script src="js/forgot-password.js"></script>

</body>
</html>
