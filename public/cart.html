<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keranjang Saya</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS -->
  <link rel="stylesheet" href="tailwind.css" />
</head>

<body class="antialiased font-sans bg-cream/30 text-ink min-h-screen flex flex-col justify-between">

 <!-- ============================================= -->
  <!-- 1. HEADER — MAIN NAVBAR                       -->
  <!-- ============================================= -->
  <header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-brown/10">
    <div class="max-w-7xl mx-auto px-6 md:px-12 h-16 md:h-20 flex items-center justify-between">

      <!-- Kiri: Logo -->
      <a href="index.html" class="font-serif font-bold text-xl md:text-2xl text-brown tracking-tight">
        Zahasky.
      </a>

      <!-- Tengah: Menu Utama (desktop) -->
      <nav class="hidden md:flex items-center gap-10 text-base">
        <a href="index.html" class="nav-link">Home</a>
        <a href="catalog.html" class="nav-link">Catalog</a>
        <a href="package.html" class="nav-link">Package</a>
        <a href="publicity.html" class="nav-link">Publicity</a>
        <a href="contact.html" class="nav-link-active">Contact</a>
      </nav>

      <!-- Kanan: Cart, Auth Status (desktop) + Hamburger (mobile) -->
      <div class="flex items-center gap-2 md:gap-4">
        
        <!-- Icon Keranjang Belanja -->
        <button type="button" aria-label="Keranjang belanja" class="relative p-2 rounded-full hover:bg-brown/5 transition-colors cursor-pointer">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-ink" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h1.5l1.6 9.6a2 2 0 0 0 2 1.65h8.1a2 2 0 0 0 2-1.65L20 7H6" />
            <circle cx="9.5" cy="19.5" r="1.5" fill="currentColor" stroke="none" />
            <circle cx="16.5" cy="19.5" r="1.5" fill="currentColor" stroke="none" />
          </svg>
          <span id="cart-count" class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 flex items-center justify-center rounded-full bg-brown text-cream text-[10px] font-mono font-semibold leading-none">
            0
          </span>
        </button>

        <!-- KONDISI 1: Guest (Belum Login) -->
        <div id="guest-nav" class="flex items-center gap-4">
          <a href="login.html" class="text-base nav-link">Login</a>
          <a href="register.html">
            <button type="button" class="rounded-pill bg-brown text-cream text-base font-semibold px-5 py-2.5 hover:bg-brown/80 transition-colors cursor-pointer">
              Register
            </button>
          </a>
        </div>

        <!-- KONDISI 2: User (Sudah Login) -->
        <div id="user-nav" class="hidden items-center">
          <a href="profile.html" title="Profil Saya" class="p-2 rounded-full text-ink hover:bg-brown/5 transition-colors cursor-pointer flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
            </svg>
          </a>
        </div>

        <!-- Hamburger toggle (mobile) -->
        <button
          type="button"
          id="mobile-menu-toggle"
          aria-label="Buka menu"
          aria-expanded="false"
          aria-controls="mobile-menu"
          class="md:hidden p-2 rounded-full hover:bg-brown/5 transition-colors cursor-pointer">
          <svg id="icon-open" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-ink" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <svg id="icon-close" xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-ink hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </header>

 <!-- MAIN CONTENT -->
  <main class="max-w-7xl mx-auto px-3 sm:px-6 md:px-12 py-4 md:py-6 w-full flex-1 pb-24 md:pb-6">

    <!-- TOMBOL KEMBALI -->
    <div class="mb-3 md:mb-4">
      <button type="button" onclick="history.back()" class="inline-flex items-center gap-2 text-xs md:text-sm font-semibold text-muted hover:text-brown transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        <span>Kembali ke Halaman Sebelumnya</span>
      </button>
    </div>

    <h1 class="font-serif text-xl md:text-3xl font-bold text-brown mb-4 md:mb-6">Keranjang Saya</h1>

    <!-- KERANJANG KOSONG -->
    <div id="cart-empty" class="hidden flex-col items-center justify-center text-center py-16 bg-white border border-brown/10 rounded-none shadow-sm">
      <div class="w-16 h-16 bg-brown/5 flex items-center justify-center text-brown mb-4">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
        </svg>
      </div>
      <h2 class="font-serif text-lg font-bold text-brown">Keranjang Belanjaanmu Kosong</h2>
      <p class="text-xs md:text-sm text-muted mt-1">Belum ada produk yang ditambahkan ke keranjang.</p>
      <a href="catalog.html" class="mt-5 inline-block bg-brown text-cream text-sm font-semibold px-6 py-3 hover:bg-ink transition-colors rounded-none shadow-sm">
        Lihat Katalog Produk
      </a>
    </div>

<!-- KERANJANG TERISI -->
<div id="cart-content" class="flex flex-col gap-4">

  <!-- WRAPPER SCROLL HORIZONTAL MOBILE -->
  <div class="bg-white border border-brown/10 rounded-none shadow-sm overflow-x-auto">
    <div class="min-w-[650px]"> 
      <!-- HEADER TABEL (Tampil di Mobile & Desktop dengan Grid) -->
        <div class="grid cart-table-grid gap-4 px-4 md:px-6 py-4 bg-white border-b border-brown/10 text-xs md:text-sm text-muted">        <div class="flex items-center justify-left">
          <input type="checkbox" id="check-all-header" onchange="toggleSelectAll(this.checked)" class="w-4 h-4 accent-brown cursor-pointer">
        </div>
        <div class="text-left font-medium text-ink">Produk</div>
        <div class="text-left font-medium">Harga Satuan</div>
        <div class="text-left font-medium">Kuantitas</div>
        <div class="text-left font-medium">Total Harga</div>
        <div class="text-left font-medium">Aksi</div>
      </div>

      <!-- LIST ITEM KERANJANG -->
      <div id="cart-items-list" class="divide-y divide-brown/10"></div>
    </div>
  </div>

      <!-- BOTTOM BAR SHOPEE MOBILE & DESKTOP -->
      <div class="fixed md:static bottom-0 left-0 right-0 z-40 bg-white border-t md:border border-brown/10 shadow-lg md:shadow-sm px-4 md:px-0 md:pl-6 flex items-center justify-between h-16 md:h-auto">
        
        <!-- Sisi Kiri: Checkbox Pilih Semua -->
        <div class="flex items-center gap-1 md:gap-2 text-xs md:text-sm text-ink">
          <input type="checkbox" id="check-all-footer" onchange="toggleSelectAll(this.checked)" class="w-4 h-4 accent-brown cursor-pointer">
          <label for="check-all-footer" class="cursor-pointer select-none font-medium">
            Semua <span class="hidden md:inline">(<span id="total-cart-items-count">0</span>)</span>
          </label>
          <button type="button" onclick="deleteSelectedItems()" class="hidden md:inline-block ml-4 text-muted hover:text-red-500 transition-colors">
            Hapus Terpilih
          </button>
        </div>

        <!-- Sisi Kanan: Total & Tombol Checkout -->
        <div class="flex items-center gap-2 md:gap-6">
            <div class="text-right">
                <span class="text-[10px] md:text-sm text-ink hidden md:inline">Total:</span>
                <span id="summary-total-price" class="font-mono text-sm md:text-2xl font-bold text-brown block md:inline">Rp 0</span>
            </div>

          <button type="button" onclick="checkout()" class="bg-brown text-cream text-xs md:text-base font-bold px-5 md:px-10 h-10 md:h-14 hover:bg-ink transition-colors rounded-none shadow-none flex items-center justify-center">
            Checkout
          </button>
        </div>

      </div>

    </div>

  </main>


  <!-- FOOTER -->
  <footer class="bg-brown text-cream mt-12">
    <div class="max-w-7xl mx-auto px-6 md:px-12 py-6 text-center text-xs text-cream/60">
      <p>&copy; 2026 Zahasky. All rights reserved.</p>
    </div>
  </footer>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/supabaseClient.js"></script>
  <script src="./assets/js/main.js"></script>
  <script src="./assets/js/cart-helper.js"></script>
  <script src="./assets/js/cart.js"></script>
</body>
</html>
